# Judge discriminator CE. Distinct from the generator SFT configs: the target is a single
# A/B token, so packing is off (it would merge examples across the target boundary) and
# the stop token is NOT supervised (that would make the target two tokens). The eval path
# decodes with max_tokens=1, so the model is never asked to emit a terminator.
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
use_qlora: false

# NOTE: this key is documentation of intent only — lora_sft.py does not read `packing`
# from the config. Packing is controlled solely by the --no_packing CLI flag (default is
# packing ON). The launcher that trains this config MUST pass --no_packing explicitly.
packing: false
supervise_stop_token: false

num_epochs: 3
batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-4
lr_scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.01

gradient_checkpointing: true
logging_steps: 10
report_to: none
save_strategy: epoch
