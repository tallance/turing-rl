# Qwen3.5-9B LoRA SFT config (generator sweep).
# Identical hyperparameters to qwen3_8b_lora.yaml (paper Table 5): LoRA r=64/alpha=128,
# bf16 (no QLoRA), 3 epochs. Base model selected by the launcher (--model qwen35-9b);
# lora_sft.py auto-loads this file from the --model alias.
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
use_qlora: false

# Supervise the trailing <|im_end|> so the model learns to STOP its turn. Without this,
# the SFT'd 9B generates a coherent user turn then degenerates into non-terminating
# repetition (verified). Attention+MLP-only LoRA alone did not fix it — this is the fix.
supervise_stop_token: true

num_epochs: 3
batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2e-4
lr_scheduler: cosine
warmup_ratio: 0.05
weight_decay: 0.01

gradient_checkpointing: true
logging_steps: 10
report_to: none
# One checkpoint per epoch, ALL retained (save_kwargs_from_config drops save_total_limit
# when strategy=epoch). Yields checkpoint-26/52/78 = epochs 1/2/3 for the trajectory study.
save_strategy: epoch
