# veRL GRPO config for judge-only RLVR (Qwen3.5 2B / 4B / 9B discriminators).
#
# Composes the shared 8B base for structure, then overrides what the judge side needs
# differently:
#   - reward is training/grpo/judge_reward.py: local, label-verifiable, no judge server
#   - thinking ON, matching what generator RL actually ran against
#   - long prompts: a rendered TURING_PROMPT is ~6k tokens against ~1k for a generator prompt
#   - the 9B optimiser recipe (lr 1e-4, kl 1e-4, rollout T=1.0), not the 8B-era defaults
#
# actor_rollout_ref.model.path is set per run by scripts/slurm/judge_grpo_train.sh.
defaults:
  - qwen3_8b_grpo
  - _self_

data:
  train_files: data/prism/judge/iter1/train.parquet
  val_files: data/prism/judge/iter1/val.parquet
  train_batch_size: 64
  # MEASURED, not guessed. Across 1,121 built contexts (416 train + 705 val), the rendered
  # judge prompt runs p50 ~7,500 / p95 ~10,000 / max 12,743 estimated tokens. The earlier
  # 10,240 placeholder left 3.1% of train and 3.8% of val rows over budget, and
  # `filter_overlong_prompts: true` DROPS those silently from train AND val -- biasing every
  # result toward short-history users. 14,336 clears the largest observed prompt by ~12%.
  # Note the observed max ROSE 10% when the sample grew from 416 to 1,121 contexts: sample
  # maxima grow with sample size, so re-read <split>.meta.json's n_over_budget for any new
  # slice before submitting rather than assuming this number still covers it.
  max_prompt_length: 14336
  # Deliberately ~p90 of the frozen judge's measured completion length (7,452 over 91,398
  # real thinking-ON calls, run 14217), NOT the 8,192 eval budget. The cap is a shaping
  # signal: a truncated rollout scores 0, so GRPO pushes the policy toward concision, and at
  # p90 only ~6% truncate -- enough pressure to matter, small enough that verdict accuracy
  # still dominates the gradient. Do NOT drop toward 6,144: that lands on the median (5,984),
  # truncating ~44% and turning "be shorter" into the primary objective.
  # WATCH judge_rung_none: rating is the LAST schema field, so a truncated verdict yields no
  # rating at all. If that metric climbs instead of falling, the cap is fighting the policy.
  max_response_length: 7680
  truncation: left
  filter_overlong_prompts: true
  apply_chat_template_kwargs:
    enable_thinking: true

actor_rollout_ref:
  model:
    # MUST stay an explicit list. The base config says all-linear, which on a Qwen3.5
    # hybrid would attach LoRA to the Gated-DeltaNet backbone (destructive; arXiv:2604.22127).
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    exclude_modules: '.*(visual|mtp).*'
    lora_rank: 64
    lora_alpha: 32
    lora_adapter_path: null
    enable_gradient_checkpointing: true
    lora:
      # MANDATORY for a Qwen3.5 hybrid. This is the merged-dense rollout weight sync the one
      # proven 9B recipe pins (scripts/slurm/rl_generator_train_9b.sh, "merged dense sync").
      # Left at veRL's default the rollout engine may be handed base weights instead of the
      # LoRA-merged ones: the run completes, logs plausible curves, and every rollout came
      # from the untrained model. The key exists in the composed parent (veRL ppo_trainer).
      merge: true
  actor:
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true
    kl_loss_coef: 0.0001
    strategy: fsdp2
    use_dynamic_bsz: false
    optim:
      lr: 0.0001
  ref:
    strategy: fsdp2
    # The 8B generator base leaves this at 8. Judge sequences are LONGER than the 9B
    # generator's, and that recipe pins all three micro-batch knobs (actor, ref, rollout)
    # to 1; pinning only the actor one leaves the two log-prob passes to OOM at 8.
    log_prob_micro_batch_size_per_gpu: 1
  rollout:
    n: 4
    log_prob_micro_batch_size_per_gpu: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    max_model_len: 22016
    # NOT equal to max_model_len. This bounds the per-step chunked-prefill workspace, and a
    # 12k-token judge prompt is processed in chunks regardless; 4096 keeps the peak small.
    # veRL's "use 8192 or the full sequence length" advice is a throughput heuristic, not a
    # correctness requirement.
    max_num_batched_tokens: 4096
    response_length: 7680
    # The parent is an 8B *generator* profile; every value below is overridden because the
    # inherited one is wrong for a judge run -- the failure mode that cost jobs 15143/13634.
    # TP=1 matches the working 9B recipe (a 2B/4B judge has no reason to shard).
    tensor_model_parallel_size: 1
    # MEASURED on an A100-40GB at max_model_len 22,016 (capacity probe, job 15926). Qwen3.5 is
    # hybrid Gated-DeltaNet: 24 recurrent layers hold a FIXED state page per sequence and only
    # 8 attention layers cache per token, so a request costs 3 + ceil(len/528) blocks and
    # concurrency falls far more slowly with context than on a pure-attention model:
    #     util 0.55 -> 2.05 GiB cache ->  2.76x concurrency   (too few; vLLM would thrash)
    #     util 0.65 -> 6.00 GiB cache ->  8.27x
    #     util 0.70 -> 7.97 GiB cache -> 10.98x   <-- chosen
    #     util 0.75 -> 9.94 GiB cache -> 13.71x   (rejected: eats the weight-sync margin)
    # This is close to free in hybrid mode: free_cache_engine sleeps the rollout engine
    # between phases, so the extra memory is KV held only while training memory is offloaded.
    # 0.75 is left on the table deliberately -- job 11774 was a wake-up OOM at the weight-sync
    # spike, and that margin is worth more than 3x concurrency we do not need.
    gpu_memory_utilization: 0.70
    # REQUIRED: judge prompts (p95 ~10k tokens) far exceed the 4096 batched-token cap.
    enable_chunked_prefill: true
    # The inherited 64 would admit ~6x more sequences than physically fit (worst case ~11 at
    # this context length), so vLLM would accept them and then preempt. 16 sits above the
    # worst case without over-admitting; typical prompts are ~7.5k, so real concurrency is
    # higher than the worst-case figure.
    max_num_seqs: 16
    checkpoint_engine:
      # Same value the proven 9B recipe pins. Key exists in the composed parent.
      update_weights_bucket_megabytes: 3072
    val_kwargs:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      do_sample: true
      n: 1

critic:
  optim:
    lr: 0.0001

# Declared BOTH ways on purpose. veRL 0.9's V1 controller does not migrate the legacy
# top-level `custom_reward_function` block (see scripts/slurm/rl_generator_train_9b.sh),
# so a config carrying only the legacy block runs V1, never calls the reward, and scores
# every rollout 0 with no error at all. `trainer.use_v1: false` plus the nested
# `reward.custom_reward_function` block is what the working 9B run uses. This lives in the
# config rather than a submit-time override string for the same reason the 9B recipe does:
# values that can be dropped from EXTRA_OVERRIDES eventually are.
custom_reward_function:
  path: training/grpo/judge_reward.py
  name: compute_score

reward:
  custom_reward_function:
    path: training/grpo/judge_reward.py
    name: compute_score

trainer:
  use_v1: false
  # `console` is not decoration. veRL writes no metrics file of any kind; with wandb alone the
  # per-step series exists only in the wandb UI, and scripts/judge_overfit_gate.py -- which the
  # R0 gate depends on -- would have nothing on disk to read. The console backend prints every
  # logged metric to stdout, i.e. into the Slurm .out, which the gate parses directly.
  logger:
    - wandb
    - console
  project_name: grpo-judge
  default_local_dir: results/grpo/checkpoints_judge
  experiment_name: qwen35-judge-grpo
  total_epochs: 3
