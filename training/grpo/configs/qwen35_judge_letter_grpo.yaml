# veRL GRPO config for the letter_only judge: the rating_only protocol with the 1-7 scale removed.
#
# The prompt keeps the shared header and the JSON wrapper and asks for {"answer": "A"|"B"} instead
# of a rating. Everything else about the run is unchanged -- thinking ON, rollout temperature 1.0,
# the same optimiser recipe, merged-dense rollout sync, the same local label-verifiable reward --
# so this overrides only what the shorter prompt moves, exactly as the rating child does.
#
# Why the scale is gone: loop 2's rating judge answered 4 on 78.1% of examples (J3' step 1). Under
# the `graded` arm a tie pays a flat 0.75, well above the 0.5 of information it carries, and that
# payout is a CONSTANT -- so a GRPO group that ties throughout has zero advantage and yields no
# gradient at all. This arm runs `directional` over a two-way answer, where no tie is reachable and
# a hard example resolves 1/0 with real variance inside the group.
#
# Selected by scripts/slurm/judge_grpo_train.sh via JUDGE_CONFIG_NAME=qwen35_judge_letter_grpo,
# which also exports JUDGE_PROMPT_STYLE=letter_only. Run it with JUDGE_REWARD_ARM=directional.
defaults:
  - qwen35_judge_grpo
  - _self_

data:
  # MEASURED with the real Qwen3.5 tokenizer on the letter_iter1 corpus (jobs 24340/24341,
  # scripts/measure_prompt_tokens.py):
  #
  #            n     p50    p95    p99    max
  #   train  3328   2098   3794   4876   5324
  #   val    1410   2052   4091   4920   5812
  #
  # Both splits matter -- data.val_files is loaded by this same config, and val is the longer one.
  # 6656 clears the combined 5812 by 844. The value is unchanged from the rating child, which the
  # shorter prompt predicted: the seven rating anchors (~240 chars) are gone from the same header
  # over the same contexts, so this corpus came in just under rating_only's measured 5866.
  #
  # Do NOT set this from the .meta.json's prompt_tokens_est_max: that is chars/3.9 and over-counted
  # the rating corpus by ~1.35x. Its n_over_budget field is computed against the builder's
  # PROMPT_BUDGET_TOKENS (default 10240), not against this key, so it does not gate this value.
  #
  # Re-measure per slice: the observed maximum grows with sample size, and filter_overlong_prompts
  # is true in the parent, dropping over-budget rows from train AND val silently -- biasing the
  # corpus toward short-history users without ever failing.
  max_prompt_length: 6656

actor_rollout_ref:
  rollout:
    # max_prompt_length + max_response_length, and nothing else. max_response_length stays at the
    # parent's 10752: the answer is ~10 tokens, so the whole budget is thinking room. Do NOT cut it
    # because the answer got shorter -- a cap costs nothing by itself (peak memory tracks the ACTUAL
    # sequence length), and clipping a judge mid-reasoning scores task 0.0, biasing training
    # quietly. tests/test_judge_length_budget.py pins the sum.
    #
    # Held as a literal because OmegaConf cannot do arithmetic; the parent holds 22016 the same way.
    max_model_len: 17408

trainer:
  # Same three as the rating child, for the same reasons: 13 with val_before_train is what every
  # full judge GRPO arm has used, and total_epochs must live in the file rather than in a submit
  # string, where a dropped override silently turns an ~18h round into ~54h.
  test_freq: 13
  val_before_train: true
  total_epochs: 1
